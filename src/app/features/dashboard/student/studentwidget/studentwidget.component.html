<div class="stats-card">
  <div class="stats-content">
    <span class="stats-title">{{ title }}</span>
    <h2>{{ value }}</h2>
    <p class="green">{{ description }}</p>
  </div>
  <div class="stats-icon {{ iconColor }}">
    <span aria-hidden="true" [ngSwitch]="icon">
      <svg *ngSwitchCase="'attendance'" viewBox="0 0 24 24" focusable="false">
        <path d="M7 4v3M17 4v3M4 9h16"></path>
        <rect x="4" y="6" width="16" height="14" rx="2"></rect>
        <path d="m9 14 2 2 4-4"></path>
      </svg>
      <svg *ngSwitchCase="'marks'" viewBox="0 0 24 24" focusable="false">
        <path d="M6 19V10"></path>
        <path d="M12 19V5"></path>
        <path d="M18 19v-7"></path>
      </svg>
      <svg *ngSwitchCase="'tests'" viewBox="0 0 24 24" focusable="false">
        <path d="M8 4h8"></path>
        <path d="M9 2v4M15 2v4"></path>
        <rect x="5" y="6" width="14" height="16" rx="2"></rect>
        <path d="M8 11h8M8 15h5"></path>
      </svg>
      <svg *ngSwitchCase="'homework'" viewBox="0 0 24 24" focusable="false">
        <path d="M7 4h8l3 3v13H7z"></path>
        <path d="M15 4v4h4"></path>
        <path d="M9 13h6M9 17h4"></path>
      </svg>
      <svg *ngSwitchDefault viewBox="0 0 24 24" focusable="false">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 10v5"></path>
        <path d="M12 7h.01"></path>
      </svg>
    </span>
  </div>
</div>
