<div class="topbar">
  <div class="topbar-left">
    <div class="logo">
      <span class="topbar-symbol" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M12 3 4 7v5c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V7l-8-4Z" />
          <path d="M9.5 11.5h5M12 9v5" />
        </svg>
      </span>
      <span class="app-title">SmartTech</span>
    </div>
  </div>
  <div class="topbar-right">
    <div class="topbar-item">
      <span class="topbar-symbol" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M12 4a5 5 0 0 0-5 5v2.4l-1.2 2.6A1 1 0 0 0 6.7 15h10.6a1 1 0 0 0 .9-1.4L17 11.4V9a5 5 0 0 0-5-5Z" />
          <path d="M10 18a2 2 0 0 0 4 0" />
        </svg>
      </span>
      <span class="notification-badge">3</span>
    </div>

    <div class="user-dropdown">
      <button class="topbar-item user-menu-trigger" type="button" (click)="toggleUserMenu($event)" [attr.aria-expanded]="isUserMenuOpen">
        <span class="topbar-symbol" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z" />
            <path d="M5 20a7 7 0 0 1 14 0" />
          </svg>
        </span>
        <span class="user-name">{{ userName }}</span>
        <span class="topbar-symbol topbar-symbol--small topbar-arrow" [class.is-open]="isUserMenuOpen" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="m7 10 5 5 5-5" />
          </svg>
        </span>
      </button>

      @if (isUserMenuOpen) {
        <div class="user-dropdown-menu">
          <button class="dropdown-item dropdown-item--danger" type="button" (click)="logout()">
            <span class="topbar-symbol" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" />
                <path d="M10 12h10" />
                <path d="m12 9-3 3 3 3" />
              </svg>
            </span>
            <span>Logout</span>
          </button>
        </div>
      }
    </div>
  </div>
</div>
